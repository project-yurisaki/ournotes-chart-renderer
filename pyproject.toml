[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ournotes-chart-renderer"
version = "0.1.0"
description = "Parse Our Notes SS/gzip charts and render flat chart previews with Skia"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["skia-python>=144"]

[project.optional-dependencies]
test = ["Pillow>=10"]

[project.scripts]
ournotes-chart-render = "on_chart.cli:main"

[tool.setuptools.packages.find]
include = ["on_chart*"]

[tool.setuptools.package-data]
on_chart = ["assets/*.otf", "assets/*OFL.txt", "assets/logo.png"]
